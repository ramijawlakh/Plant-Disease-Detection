<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Disease Detector</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <h1>🌿 Plant Disease Detector</h1>

        <!-- Image Upload Section -->
        <section>
            <h2>📷 Predict from Image</h2>
            <form id="predictForm">
                <input type="file" id="imageInput" accept="image/*" required /><br/>
                <label>Confidence Threshold: 
                    <input type="number" id="confidenceInput" min="0" max="1" step="0.1" value="0.5" />
                </label><br/>
                <button type="submit">Predict</button>
            </form>
            <img id="resultImage" style="max-width: 100%; margin-top: 10px;" />
        </section>

        <!-- Chatbot Section -->
        <section>
            <h2>💬 Chat with the Bot</h2>
            <div id="chatContainer">
                <!-- Messages will be added here dynamically -->
            </div>
            <form id="chatForm">
                <input type="text" id="chatInput" placeholder="Ask me anything about plant diseases..." required />
                <button type="submit">Send</button>
            </form>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
